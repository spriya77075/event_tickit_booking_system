
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventEase - Event Booking</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>🎟 EventEase</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#events">Events</a>
            <a href="#booking">My Booking</a>
        </nav>
    </header>

    <section class="hero" id="home">
        <h1>Discover Amazing Events</h1>
        <p>Find events, book your tickets, and create memories.</p>
        <a href="#events" class="hero-btn">Explore Events</a>
    </section>

    <main>
        <section id="events">
            <h2 class="section-title">Upcoming Events</h2>
            <div id="event-list" class="event-container"></div>
        </section>

        <section id="booking" class="booking-section">
            <h2 class="section-title">Book Your Ticket</h2>

            <form id="booking-form">
                <label for="customer-name">Your Name</label>
                <input type="text" id="customer-name"
                       placeholder="Enter your name" required>

                <label for="customer-email">Email Address</label>
                <input type="email" id="customer-email"
                       placeholder="Enter your email" required>

                <label for="event-select">Select Event</label>
                <select id="event-select" required>
                    <option value="">-- Select Event --</option>
                </select>

                <label for="ticket-count">Number of Tickets</label>
                <input type="number" id="ticket-count"
                       min="1" max="10" value="1" required>

                <label for="payment-method">Payment Method</label>
                <select id="payment-method" required>
                    <option value="">-- Select Payment Method --</option>
                    <option value="UPI">UPI</option>
                    <option value="Credit Card">Credit Card</option>
                    <option value="Debit Card">Debit Card</option>
                    <option value="Net Banking">Net Banking</option>
                </select>

                <p id="total-price">Total: ₹0</p>
                <button type="submit">Confirm Booking</button>
            </form>

            <div id="booking-result"></div>
        </section>
    </main>

    <footer>
        <p>© 2026 EventEase | Frontend Demo Project</p>
    </footer>

    <script src="events.js"></script>
    <script src="booking.js"></script>
    <script src="script.js"></script>
</body>
</html>
